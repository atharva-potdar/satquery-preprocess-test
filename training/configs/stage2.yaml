# SatQuery Training Stage 2 — Single-Image + Resolution Curriculum
# Focus: VRSBench, RSVQA-HR (dual-resolution)
# Output: stage2_adapter.pt

model:
  name: "unsloth/Qwen3-VL-8B-Instruct-unsloth-bnb-4bit"
  use_dora: true
  adapter_path: "checkpoints/stage1/adapter.pt"  # Resume from stage 1

training:
  stage: 2
  epochs: 1.5
  batch_size: 2
  gradient_accumulation_steps: 4  # Effective batch = 8
  learning_rate: 1e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  max_steps: 10000
  weight_decay: 0.01

data:
  jsonl_dirs:
    - "data/vrsbench_output"
    - "data/rsvqa_hr_output"
  val_jsonl: null  # Use mixed val from each
  replay_fraction: 0.10  # 10% from stage 1
  replay_jsonl: "data/bigen_output/bigen.jsonl"
  max_samples: null

curriculum:
  # R4 dual-resolution: 80:20 → 50:50 → 30:70 native:proxy across stage
  native_proxy_ratio: [0.8, 0.5, 0.3]  # Transitions at 33%, 66% of steps

checkpoint:
  save_every: 2000
  output_dir: "checkpoints/stage2"
  resume_from: null

logging:
  eval_every: 500
  log_every: 50
  wandb_project: "satquery"
  wandb_run_name: "stage2_single_image"
