# SatQuery Training Stage 3 — Multi-Image Reasoning
# Focus: CDVQA, LEVIR-CD, OSCD, SpaceNet6 pair, SARDet-100K
# Output: stage3_adapter.pt (final)

model:
  name: "unsloth/Qwen3-VL-8B-Instruct-unsloth-bnb-4bit"
  use_dora: true
  adapter_path: "checkpoints/stage2/adapter.pt"  # Resume from stage 2

training:
  stage: 3
  epochs: 1.5
  batch_size: 2
  gradient_accumulation_steps: 4  # Effective batch = 8
  learning_rate: 5e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  max_steps: 10000
  weight_decay: 0.01

data:
  jsonl_dirs:
    - "data/cdvqa_output"
    - "data/levir_cd_output"
    - "data/oscd_output"
    - "data/sn6_opt_output"
    - "data/sardet_output"
  val_jsonl: null
  replay_fraction: 0.10  # 10% from stage 2
  replay_jsonl: null  # Mix from stage 2 dirs
  max_samples: null

curriculum:
  native_proxy_ratio: [0.3, 0.3, 0.3]  # Maintains stage 2 ratio

checkpoint:
  save_every: 2000
  output_dir: "checkpoints/stage3"
  resume_from: null

logging:
  eval_every: 500
  log_every: 50
  wandb_project: "satquery"
  wandb_run_name: "stage3_multi_image"
